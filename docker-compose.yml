name: nestloop-compare

services:
  db:
    image: postgres:16-alpine
    # 关闭并行查询：迁库后实例未开并行，结算 SQL 才会走到嵌套循环计划
    command: postgres -c max_parallel_workers_per_gather=0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: settlement
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d settlement"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"

  web:
    build: ./app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/settlement
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
